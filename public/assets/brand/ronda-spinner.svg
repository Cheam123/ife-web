<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="96" height="96" role="img" aria-label="Loading">
  <title>Loading</title>
  <style>
    .spin { transform-origin: 50px 50px; animation: spin 1.1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 4s; } }
  </style>
  <!-- The Ronda mark: a ring with a gap at the top and a coral dot in the gap, turning. -->
  <g class="spin">
    <circle cx="50" cy="50" r="34" fill="none" stroke="#0D729E" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="178 35.6" transform="rotate(-60 50 50)"/>
    <circle cx="50" cy="16" r="7" fill="#FF6B4A"/>
  </g>
</svg>
